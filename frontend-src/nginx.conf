events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # 日志格式
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;

    # 「存入历史资料」走 multipart 上传，nginx 默认 1MB 会直接 413，
    # 这里放到 2GB（后端 /api/v1/course/archive-file 不限格式，靠这个上限兜底）
    client_max_body_size 2g;
    
    # Gzip压缩
    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    # 前端静态文件服务
    server {
        listen       80;
        server_name  localhost;
        
        # 静态文件根目录
        root   /usr/share/nginx/html;
        index  pages/index.html;
        
        # 处理前端路由
        location / {
            try_files $uri $uri/ /pages/index.html;
            # 前端静态资源禁用缓存，确保升级后浏览器立即拉取最新版本
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        
        # API代理到后端服务
        location /api/v1/ {
            proxy_pass http://backend:8000/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # WebSocket代理到后端服务
        location /api/v1/ws/ {
            proxy_pass http://backend:8000/api/v1/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
        
        # 错误页面
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }

    # 教师端独立入口（宿主机 8326 映射）。教师端是 Vue3 单页应用，
    # API 走同源 /api/*：/api/teacher-portal/* 对应后端 /api/v1/teacher-portal/*，
    # /api/user/* 等其余路径统一加 /api/v1/ 前缀（接口补齐阶段逐步生效）。
    server {
        listen       8326;
        server_name  localhost;

        root   /usr/share/nginx/teacher;
        index  index.html;

        # Vue3 history 路由回退 + 禁用缓存（升级后浏览器立即拉取最新资源）
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 本地 Monaco（与学生端共用同一份 vendor，禁外网 CDN）。
        # 教师端 root（/usr/share/nginx/teacher）不含该目录，这里别名指向学生端静态目录。
        location /js/vendor/monaco/ {
            alias /usr/share/nginx/html/js/vendor/monaco/;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 教师端 API 代理。rewrite 规则：
        #   1) /api/teacher-portal/* → /api/v1/teacher-portal/*（课程生成引擎）
        #   2) /api/v1/*            → 原样透传（学生端既有接口，如 file/test-question）
        #   3) 其余 /api/*          → 加 /api/v1/ 前缀（认证 /api/user/* 等补齐后用）
        location /api/ {
            rewrite ^/api/teacher-portal/(.*)$ /api/v1/teacher-portal/$1 break;
            rewrite ^/api/v1/(.*)$ /api/v1/$1 break;
            rewrite ^/api/(.*)$ /api/v1/$1 break;

            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 事件流：关闭缓冲与压缩，保证事件即时到达
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 86400;
        }
    }
}